version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    groups:
      typescript-eslint:
        patterns:
          - '@typescript-eslint/*'
          - 'typescript-eslint'
      rollup:
        patterns:
          - 'rollup'
          - '@rollup/*'
      jest:
        patterns:
          - 'jest'
          - 'ts-jest'
          - 'ts-jest-resolver'
          - '@jest/*'
